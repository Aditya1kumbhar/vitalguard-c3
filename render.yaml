services:
  # ── VitalGuard C3 Backend (FastAPI + WebSocket + SQLite) ──
  - type: web
    name: vitalguard-c3-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
